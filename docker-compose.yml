services:
  postgres:
    image: postgres:16-alpine
    container_name: campusslots-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusslots}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusslots_dev}
      POSTGRES_DB: ${POSTGRES_DB:-campusslots}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campusslots} -d ${POSTGRES_DB:-campusslots}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campusslots-redis
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: